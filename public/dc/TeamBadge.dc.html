<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ t.mono }}">
<div style="width:100%;height:100%;border-radius:{{ radius }};background:{{ t.c }};display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)">
<span style="color:#fff;font-family:'Saira Condensed',system-ui,sans-serif;font-weight:800;font-size:{{ fs }};letter-spacing:.4px;line-height:1">{{ t.abbr }}</span>
</div>
</sc-if>
<sc-if value="{{ t.logo }}">
<div style="width:100%;height:100%;border-radius:{{ radius }};background:#eef2f7;border:2px solid {{ t.c }};display:grid;place-items:center">
<img src="{{ t.logo }}" alt="{{ t.name }}" style="width:78%;height:78%;object-fit:contain"/>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,abbr:string,c:string,mono:boolean,logo:string}&quot;},&quot;fs&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;15px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;radius&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;12px&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
